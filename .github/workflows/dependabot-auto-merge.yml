name: Dependabot auto-merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Merge minor and patch updates after CI passes
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in {1..60}; do
            conclusion=$(gh run list \
              --workflow tests.yml \
              --event pull_request \
              --commit "$PR_SHA" \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0] | if . == null or .status != "completed" then "pending" else .conclusion end')

            case "$conclusion" in
              success)
                gh pr merge "$PR_URL" --squash --match-head-commit "$PR_SHA"
                exit 0
                ;;
              pending)
                sleep 30
                ;;
              *)
                echo "CI did not pass: $conclusion"
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for CI to pass."
          exit 1
